[project]
name = "forwork"
version = "0.2.0"
description = "Derrick 的工作小工具库：文件清单、数据合并、抽样、图片处理与审计底稿生成"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "xlwings>=0.37.6",
]

[project.scripts]
forwork = "forwork.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "RET", "C4", "PIE", "ARG"]
ignore = [
    "E501",   # 行宽交给 ruff format
    "ARG002", # 回调/接口里未使用的参数
    "B008",   # argparse 里函数调用是惯用写法
]

